<style>
        .neo-glass {
            background: rgba(30, 38, 56, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow: 0 6px 16px rgba(0, 230, 118, 0.3);
        }
        .text-gradient {
            background: linear-gradient(90deg, #00E676, #00B0FF);

<body class="bg-background text-on-background font-body-lg min-h-screen flex items-center justify-center bg-radial-gradient antialiased">
<!-- Mobile Device Container (390x844) -->
<main class="w-full max-w-[390px] h-[844px] relative overflow-hidden flex flex-col justify-between" style="background: radial-gradient(circle at top, #121824 0%, #0A0D12 100%);">
<!-- Top App Bar (Shared Component - Nav Suppressed for Onboarding) -->
<header class="flex justify-end items-center px-margin-mobile pt-[54px] w-full z-50 bg-transparent no-border flat no shadows">
<button class="font-body-sm text-body-sm text-on-surface-variant font-medium hover:opacity-80 transition-opacity duration-200">
                Skip
            </button>
</header>
<!-- Hero Section (Illustration) -->
<section class="flex-1 flex items-center justify-center relative z-10 px-margin-mobile mt-4">
<div class="relative w-[320px] h-[280px] flex items-center justify-center">
<!-- Abstract glowing circuit pattern behind the bus for extra depth -->
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at center, rgba(0,230,118,0.4) 0%, transparent 70%);"></div>

</div>
</section>
<!-- Content Section (Glassmorphism Panel) -->
<section class="relative z-20 px-margin-mobile pb-[34px] flex flex-col items-start w-full">
<!-- Pill Badge -->
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-primary-container bg-primary-container/15 mb-6">
<span class="text-[14px]">⚡</span>
<span class="font-label-caps text-label-caps text-primary-container tracking-widest">HARYANA CITY BUS SERVICE</span>
</div>
<!-- Main Heading -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-white mb-4 leading-tight">
                The <span class="text-gradient">Metro on Road</span><br/>for Haryana
            </h1>
<!-- Subtitle -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl leading-relaxed">
                Track real-time e-buses, predict zero-wait ETAs, and scan-to-board cashlessly across Panipat, Gurugram, and 7+ major cities.
            </p>
<!-- Lower Area: Carousel, Button, Link -->
<div class="w-full flex flex-col items-center gap-6">
<!-- Carousel Indicators -->
<div class="flex gap-2 mb-2">
<div class="h-1.5 w-7 rounded-full bg-primary-container shadow-[0_0_8px_rgba(0,230,118,0.5)]"></div>
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant"></div>
<div class="h-1.5 w-1.5 rounded-full bg-outline-variant"></div>
</div>
<!-- Primary Button -->
<button class="w-full bg-gradient-to-r from-primary-container to-[#00c853] text-surface-container-lowest font-title-md text-title-md py-4 px-6 rounded-full flex items-center justify-center gap-2 btn-glow hover:opacity-90 active:scale-95 transition-all duration-200">
                    Get Started
                    <span class="material-symbols-outlined font-bold text-[20px]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
<!-- Login Link -->
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? <a class="text-secondary-container font-semibold hover:underline" href="#">Log In</a>
</p>

</section>

<div class="w-full flex justify-center pb-2 pt-1 absolute bottom-0 left-0">
<div class="w-[134px] h-[5px] bg-[#475569] rounded-full"></div>
